# ---------------------------------------------------------------------------
# Next-Forcing Multi-Chunk Prediction (Step 1: MCP alongside DMD, no memory gap).
#
# memory_gap_blocks is 0 here on purpose: this config isolates the effect of MCP
# on the backbone. Combining MCP with the memory gap is the next step, not this one.
# ---------------------------------------------------------------------------
# The heads get the SAME two-stage treatment as the backbone -- mirrored
# distillation, NOT the paper's supervised flow-matching recipe (which assumes
# ground-truth video that this data-free pipeline does not have):
#
#   ODE init (configs/ode_init.yaml, 3000 steps)  -- INITIALIZATION. Coupled
#     one-step x0 regression onto the shifted trajectory endpoint at the 4 student
#     timesteps, exactly like the backbone's own ODE loss (see ode_init.yaml).
#   DMD / Self Forcing (here, 600 steps)          -- DISTRIBUTION MATCHING, via the
#     ROLLOUT ITSELF. Self Forcing's principle is "simulate the inference process
#     during training"; the inference being trained for is the MCP-accelerated one,
#     so the rollout simulates exactly that loop (pipeline/self_forcing_training.py
#     _inference_with_trajectory_mcp_accelerated): the backbone denoises only the
#     ANCHOR chunks (0, 4, ...), the heads one-shot draft the following chunks from
#     their pure noise (draft = eps - v, the literal inference condition), and
#     anchor + drafts are committed to the KV cache so the next anchor conditions
#     on the drafts, exactly as deployed. The emitted video IS the deployed
#     distribution -- with all 3 heads: (main, d1, d2, d3, main, d1, d2) -- so the
#     completely unmodified DMD and critic losses train backbone and heads jointly.
#     There is NO auxiliary MCP loss in this stage. Distribution matching is what
#     turned the backbone from its blurry ODE init into a sharp one-shot generator;
#     a head trained by regression alone would stay at the conditional mean.
#
# Requires ode_init.yaml to have run with MATCHING mcp_num_layers / mcp_tap_layers,
# so the mcp.* weights in ode_init.pt load into the same shapes. The trainer's
# checkpoint load tolerates mcp.* keys being absent (ODE ran without MCP) or extra
# (ODE trained more depths than DMD keeps).
mcp_num_modules: 3          # train all three depths, as the paper does. Only depth-1
                            # survives to inference (Sec. 4.6: depth-2/3 "are not used
                            # in this mode, as their predictions are superseded by the
                            # main model in the next step") -- depths 2 and 3 exist to
                            # push gradient into the backbone.
mcp_num_layers: 3           # Table 2 says 1 block SUPERVISES better (86.5 vs 85.8),
                            # but the goal here is an accelerated model: depth-1 has to
                            # actually GENERATE chunk t+1 at inference, which needs the
                            # capacity. That is why the paper keeps 3 too.
mcp_tap_layers: [3, 11, 19, 29]
mcp_depth_weights: [0.5, 0.2, 0.1]  # Eq. 13 / Sec. 5.1 -- ODE stage only. The DMD
                            # stage has no per-depth weighting: every drafted chunk
                            # in the accelerated rollout is a FINAL output chunk.
mcp_accel_depths: 3         # how many heads deploy at inference; the rollout
                            # advances this + 1 chunks per autoregressive step.
                            # 3 -> 4x (main, d1, d2, d3, ...); 1 -> the paper's 2x
                            # mode. Depths beyond this still run in the chain
                            # (they are its trunk) but emit nothing and get no
                            # DMD-stage gradient.
mcp_loss_weight: 1.0        # ODE stage only (no separate MCP loss exists here).
# No mcp_lr: MCP params train at the shared `lr` above. The heads arrive here
# already trained by the ODE stage (3000 steps), so DMD is adaptation, not
# from-scratch learning. Setting mcp_lr re-enables the separate param group in
# trainer/distillation.py if the heads ever need to move faster than 2e-6.

# COST NOTE: this config trains CHEAPER than plain self_forcing_dmd. The rollout
# denoises only the anchor chunks (2 of 7 blocks with 4x), so backbone forwards
# per rollout drop from 35 to 15 (+ two lightweight head chains); the DMD/critic
# losses are unchanged in count and price. The earlier designs (teacher-x0
# regression, then draft-substituted hybrid KL passes) are gone: the rollout
# itself now carries the drafts, which is both the cheapest and the most
# deployment-faithful formulation.
