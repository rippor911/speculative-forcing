independent_first_frame: false
warp_denoising_step: false
weight_decay: 0.01
same_step_across_blocks: true
discriminator_lr_multiplier: 1.0
last_step_only: false
i2v: false
num_training_frames: 21
gc_interval: 100
context_noise: 0
causal: true
memory_gap_blocks: 0
memory_gap_sample_mode: fixed
memory_gap_min_blocks: 0
memory_gap_max_blocks: 0

# Next-Forcing Multi-Chunk Prediction heads. 0 disables them entirely and keeps
# every code path byte-identical to upstream Self-Forcing.
mcp_num_modules: 0
mcp_num_layers: 3
mcp_tap_layers: [3, 11, 19, 29]
mcp_depth_weights: [0.5, 0.2, 0.1]
mcp_loss_weight: 1.0
mcp_lr: null
mcp_init_seed: 0
mcp_accel_depths: null          # heads deployed at inference; the accelerated
                                # rollout advances this + 1 chunks per AR step.
                                # null = all trained heads

ckpt_step: 0
prompt_name: MovieGenVideoBench
prompt_path: prompts/MovieGenVideoBench.txt
eval_first_n: 64
num_samples: 1
height: 480
width: 832
num_frames: 81
